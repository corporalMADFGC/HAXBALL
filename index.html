<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F7 Ranking Room - Temporada 1</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f1b2d;--mut:#5b6b80;--line:#cbd5e1;--blue:#1e5bb8;--gold:#b07800}
@media(prefers-color-scheme:dark){:root{--bg:#0d1624;--card:#142033;--ink:#e8eef6;--mut:#93a4ba;--line:#26364d;--blue:#6aa3ff;--gold:#f0b429}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:24px 12px 64px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0 0 4px;font-weight:700}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.time-bar, .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.time-bar button, .tabs button{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.time-bar button[aria-selected=true], .tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bar input{flex:1;min-width:140px;font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:950px;font-size:.82rem}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--mut);font-size:.85rem}
th:nth-child(2),td:nth-child(2){text-align:left}
td.pos{color:var(--mut);width:1%;font-weight:600}
tr.top td.pos{color:var(--gold);font-weight:700}
td.name{font-weight:600;cursor:pointer;color:var(--blue)}
td.name:hover{text-decoration:underline}
.empty{padding:32px;text-align:center;color:var(--mut)}

/* MODAL CARTA FIFA Y PES ROMBO */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.fut-card-gold{width:320px;height:490px;background:radial-gradient(circle, #f9e29c 0%, #d4a743 60%, #a67c1e 100%);border-radius:18px;padding:16px;color:#111;position:relative;display:flex;flex-direction:column;justify-content:space-between;border:3px solid #fbe59d;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.close-btn{position:absolute;top:-12px;right:-12px;background:#000;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-weight:bold;border:2px solid #fff}
.card-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(0,0,0,0.15);padding-bottom:8px}
.card-ovr{font-size:2.8rem;font-weight:900;line-height:1;margin:0}
.card-avatar{width:50px;height:50px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;border:2px solid #fff}
.pes-hexagon-container{display:flex;justify-content:center;align-items:center;margin:8px 0}
.card-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:0.8rem;font-weight:bold;background:rgba(255,255,255,0.3);padding:8px;border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>&lt;&lt;&lt;F7-RANKING ROOM&gt;&gt;&gt;</h1>
  <p class="sub" id="sub">Cargando…</p>
  
  <div class="time-bar" id="time-bar" role="tablist">
    <button type="button" aria-selected="false" onclick="elegirTiempo('diario')">📅 Diario</button>
    <button type="button" aria-selected="false" onclick="elegirTiempo('semanal')">📅 Semanal</button>
    <button type="button" aria-selected="false" onclick="elegirTiempo('mensual')">📅 Mensual</button>
    <button type="button" aria-selected="true" onclick="elegirTiempo('temp1')">🏆 Temporada 1</button>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar"><input id="q" type="search" placeholder="Buscar jugador..." oninput="render()"></div>
  <div class="wrap">
    <table><thead id="head"></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty" hidden>No se encontraron jugadores en este periodo.</div>
  </div>
</main>

<div class="modal-overlay" id="modal" onclick="$('modal').classList.remove('active')">
  <div style="position:relative" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="$('modal').classList.remove('active')">✕</button>
    <div class="fut-card-gold">
      <div class="card-header">
        <div>
          <div class="card-ovr" id="card-ovr">--</div>
          <div style="font-size:0.75rem;font-weight:bold;text-transform:uppercase">MEDIA OVR</div>
        </div>
        <h2 id="card-name" style="margin:0;font-size:1.4rem;text-transform:uppercase;text-align:right">JUGADOR</h2>
        <div class="card-avatar" id="card-avatar">--</div>
      </div>

      <!-- Hexágono estilo PES 6 -->
      <div class="pes-hexagon-container">
        <svg width="170" height="150" viewBox="0 0 200 180" id="pes-svg"></svg>
      </div>

      <div class="card-stats-grid" id="card-info"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TABS_LISTA = ["total", "1v1", "2v2", "3v3", "4v4", "5v5", "6v6", "7v7", "full"];

let dbGlobal = { jugadores: {}, partidaHistorial: [] };
let tiempoFiltro = "temp1";
let tab = "total";
let cargando = true;

function elegirTiempo(t) {
  tiempoFiltro = t;
  document.querySelectorAll(".time-bar button").forEach(b => b.setAttribute("aria-selected", "false"));
  event.target.setAttribute("aria-selected", "true");
  render();
}

function procesarDatosFiltrados() {
  const jugOriginales = dbGlobal.jugadores || {};
  const historial = dbGlobal.partidaHistorial || [];

  if (tiempoFiltro === "temp1" || historial.length === 0) {
    return Object.values(jugOriginales);
  }

  const ahora = Date.now();
  const msLimite = tiempoFiltro === "diario" ? 24 * 60 * 60 * 1000 :
                   tiempoFiltro === "semanal" ? 7 * 24 * 60 * 60 * 1000 :
                   30 * 24 * 60 * 60 * 1000;

  const filtrados = historial.filter(p => (ahora - p.timestamp) <= msLimite);
  const mapaJugadores = {};

  filtrados.forEach(partido => {
    const mod = partido.modalidad;
    (partido.participantes || []).forEach(p => {
      const k = p.auth || p.name;
      if (!mapaJugadores[k]) {
        mapaJugadores[k] = { name: p.name, avatar: p.name.substring(0, 2).toUpperCase(), modalidades: {} };
      }
      if (!mapaJugadores[k].modalidades[mod]) {
        mapaJugadores[k].modalidades[mod] = { matches: 0, wins: 0, goals: 0, assists: 0, elo: 1000, saves: 0, cleanSheets: 0, passesTotal: 0, passesCompleted: 0, recoveries: 0, mvp: 0 };
      }
      const m = mapaJugadores[k].modalidades[mod];
      m.matches++;
      m.goals += (p.goals || 0);
      m.assists += (p.assists || 0);
      if (p.team === p.ganador) { m.wins++; m.elo += 25; }
    });
  });

  return Object.values(mapaJugadores);
}

function calcularAtributosPES(r) {
  const pj = Math.max(1, r.matches);
  
  // 1. ATAQUE (ATT)
  const att = Math.min(99, Math.round(40 + ((r.goals * 1.5 + r.assists) / pj) * 25));

  // 2. DEFENSA (DEF) - Incluye Recuperaciones, Paradas y Porterías a cero
  const def = Math.min(99, Math.round(40 + ((r.recoveries + r.saves * 1.2 + r.cleanSheets * 3) / pj) * 20));

  // 3. TÉCNICA (TEC) - Pases y asistencias
  const passPct = r.passesTotal > 0 ? (r.passesCompleted / r.passesTotal) : 0.5;
  const tec = Math.min(99, Math.round(passPct * 60 + (r.assists / pj) * 25));

  // 4. MVP / IMPACTO - Rachas + MVPs (Sustituye a Pace)
  const mvpAttr = Math.min(99, Math.round(40 + (r.mvp / pj) * 50 + (r.bestStreak || 0) * 3));

  // 5. EXPERIENCIA / RESISTENCIA (EXP)
  const exp = Math.min(99, Math.round(40 + (Math.log(pj + 1) / Math.log(1.05))));

  // 6. MENTALIDAD / ELO (MEN)
  const men = Math.min(99, Math.max(40, Math.round(40 + (r.elo - 800) / 10)));

  // MEDIA GLOBAL (OVR) EQUILIBRADA
  const eloContrib = Math.max(40, 50 + (r.elo - 1000) / 15);
  const winRateContrib = ((r.wins / pj) * 30) + 50;
  const outputContrib = Math.min(99, 40 + ((r.goals + r.assists) / pj) * 25);
  
  const ovr = Math.min(99, Math.round((eloContrib * 0.4) + (winRateContrib * 0.3) + (outputContrib * 0.3)));

  return { att, def, tec, mvpAttr, exp, men, ovr };
}

function generarSVGRomboPES(stats) {
  // Centro y radio del hexágono
  const cx = 100, cy = 90, r = 65;
  const labels = ["ATT", "DEF", "TEC", "MVP", "EXP", "MEN"];
  const vals = [stats.att, stats.def, stats.tec, stats.mvpAttr, stats.exp, stats.men];
  
  let gridLines = "";
  for (let level = 0.25; level <= 1; level += 0.25) {
    let pts = [];
    for (let i = 0; i < 6; i++) {
      let angle = (Math.PI / 3) * i - Math.PI / 2;
      pts.push(`${cx + r * level * Math.cos(angle)},${cy + r * level * Math.sin(angle)}`);
    }
    gridLines += `<polygon points="${pts.join(" ")}" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>`;
  }

  let polyPts = [];
  let labelTags = "";
  for (let i = 0; i < 6; i++) {
    let angle = (Math.PI / 3) * i - Math.PI / 2;
    let factor = Math.max(0.2, vals[i] / 100);
    let px = cx + r * factor * Math.cos(angle);
    let py = cy + r * factor * Math.sin(angle);
    polyPts.push(`${px},${py}`);

    let lx = cx + (r + 18) * Math.cos(angle);
    let ly = cy + (r + 18) * Math.sin(angle);
    labelTags += `<text x="${lx}" y="${ly + 4}" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">${labels[i]} ${vals[i]}</text>`;
  }

  return `
    ${gridLines}
    <polygon points="${polyPts.join(" ")}" fill="rgba(30,91,184,0.5)" stroke="#1e5bb8" stroke-width="2"/>
    ${labelTags}
  `;
}

function obtenerVistaJugador(p, modo) {
  const mods = p.modalidades || {};
  let targetKeys = modo === "total" ? Object.keys(mods) : [modo];
  let r = { 
    matches: 0, wins: 0, goals: 0, assists: 0, ownGoals: 0, 
    saves: 0, cleanSheets: 0, passesTotal: 0, passesCompleted: 0, 
    recoveries: 0, mvp: 0, streak: 0, bestStreak: 0, elo: 1000 
  };
  let totalElo = 0, countElo = 0, maxStreak = 0;

  targetKeys.forEach(mKey => {
    const m = mods[mKey];
    if (!m) return;
    r.matches += (m.matches || 0);
    r.wins += (m.wins || 0);
    r.goals += (m.goals || 0);
    r.assists += (m.assists || 0);
    r.ownGoals += (m.ownGoals || 0);
    r.saves += (m.saves || 0);
    r.cleanSheets += (m.cleanSheets || 0);
    r.passesTotal += (m.passesTotal || 0);
    r.passesCompleted += (m.passesCompleted || 0);
    r.recoveries += (m.recoveries || 0);
    r.mvp += (m.mvp || 0);
    if ((m.bestStreak || 0) > maxStreak) maxStreak = m.bestStreak;
    if (m.elo != null) { totalElo += m.elo; countElo++; }
  });

  r.elo = countElo > 0 ? Math.round(totalElo / countElo) : 1000;
  r.bestStreak = maxStreak;
  if (!r.matches && !r.goals && !r.wins) return null;
  r.name = p.name;
  r.avatar = p.avatar || p.name.substring(0, 2).toUpperCase();
  
  const calc = calcularAtributosPES(r);
  r.pes = calc;
  r.ovr = calc.ovr;
  return r;
}

function pintarTabs() {
  const cont = $("tabs"); cont.textContent = "";
  TABS_LISTA.forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; 
    b.setAttribute("aria-selected", String(t === tab));
    b.textContent = t.toUpperCase();
    b.addEventListener("click", () => { tab = t; render(); });
    cont.append(b);
  });
}

function render() {
  pintarTabs();
  const filtroTexto = $("q").value.toLowerCase();
  const datosJugadores = procesarDatosFiltrados();
  
  let list = datosJugadores
    .map(p => obtenerVistaJugador(p, tab))
    .filter(Boolean)
    .filter(p => p.name.toLowerCase().includes(filtroTexto))
    .sort((a, b) => (b.elo || 1000) - (a.elo || 1000));

  const head = $("head"); head.textContent = "";
  const hr = document.createElement("tr");
  ["#", "Jugador", "OVR", "PJ", "V", "Goles", "Asist.", "Paradas", "Pases (%)", "MVP", "ELO"].forEach(text => {
    const th = document.createElement("th"); th.textContent = text; hr.append(th);
  });
  head.append(hr);

  const tb = $("rows"); tb.textContent = "";
  
  if (list.length === 0) {
    $("empty").hidden = false;
  } else {
    $("empty").hidden = true;
    list.forEach((p, i) => {
      const tr = document.createElement("tr");
      if (i === 0) tr.className = "top";

      const pos = document.createElement("td"); pos.className = "pos"; pos.textContent = i + 1; tr.append(pos);
      
      const nm = document.createElement("td"); nm.className = "name"; nm.textContent = p.name;
      nm.addEventListener("click", () => {
        const passPct = p.passesTotal > 0 ? Math.round((p.passesCompleted / p.passesTotal) * 100) : 0;
        $("card-name").textContent = p.name;
        $("card-ovr").textContent = p.ovr;
        $("card-avatar").textContent = p.avatar;
        $("pes-svg").innerHTML = generarSVGRomboPES(p.pes);
        $("card-info").innerHTML = `
          <div>🏆 ELO: ${p.elo}</div>
          <div>🎮 PJ: ${p.matches} | 🥇 V: ${p.wins}</div>
          <div>⚽ Goles: ${p.goals}</div>
          <div>🅰️ Asistencias: ${p.assists}</div>
          <div>🧤 Paradas: ${p.saves}</div>
          <div>🔒 Porterías 0: ${p.cleanSheets}</div>
          <div>👟 Pases: ${passPct}%</div>
          <div>⭐ MVPs: ${p.mvp}</div>
        `;
        $("modal").classList.add("active");
      });
      tr.append(nm);

      const passPctVal = p.passesTotal > 0 ? Math.round((p.passesCompleted / p.passesTotal) * 100) + "%" : "-";

      [p.ovr, p.matches, p.wins, p.goals, p.assists, p.saves, passPctVal, p.mvp, p.elo].forEach(val => {
        const td = document.createElement("td"); td.textContent = val; tr.append(td);
      });
      tb.append(tr);
    });
  }

  $("sub").textContent = cargando ? "Cargando…" : `Periodo [${tiempoFiltro.toUpperCase()}] · Modo [${tab.toUpperCase()}] · ${list.length} jugadores registrados.`;
}

async function load() {
  try {
    const r = await fetch("stats.json?t=" + Date.now());
    if (r.ok) {
      const json = await r.json();
      if (Array.isArray(json)) {
        dbGlobal = { jugadores: {}, partidaHistorial: [] };
        json.forEach(j => { if (j && j.name) dbGlobal.jugadores[j.auth || j.name] = j; });
      } else if (json && typeof json === "object") {
        dbGlobal.jugadores = json.jugadores || json;
        dbGlobal.partidaHistorial = json.partidaHistorial || [];
      }
    }
  } catch (e) {
    console.error("Error al cargar stats.json:", e);
  }
  cargando = false;
  render();
}

load(); 
setInterval(load, 15000);
</script>
</body>
</html>
