<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F7 Ranking Room</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f1b2d;--mut:#5b6b80;--line:#cbd5e1;--blue:#1e5bb8;--gold:#b07800}
@media(prefers-color-scheme:dark){:root{--bg:#0d1624;--card:#142033;--ink:#e8eef6;--mut:#93a4ba;--line:#26364d;--blue:#6aa3ff;--gold:#f0b429}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:24px 12px 64px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bar button{font:inherit;font-size:.8rem;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.bar button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar input{flex:1;min-width:140px;font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px}
#orden{display:contents}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:850px;font-size:.82rem}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--mut);font-size:.85rem;user-select:none}
th abbr{text-decoration:none;border-bottom:1px dotted var(--mut);cursor:help}
th:nth-child(2),td:nth-child(2){text-align:left;width:auto}
tr:last-child td{border-bottom:0}
td.pos{color:var(--mut);width:1%;font-variant-numeric:tabular-nums;font-weight:600}
tr.top td.pos{color:var(--gold);font-weight:700}
td{font-variant-numeric:tabular-nums}
td.name{font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--blue)}
td.name:hover{text-decoration:underline}
td.name i{display:block;height:3px;margin-top:4px;background:var(--blue);border-radius:2px;opacity:.7}
td.key{font-weight:700;background:rgba(30,91,184,0.08)}
@media(prefers-color-scheme:dark){td.key{background:rgba(106,163,255,0.12)}}
.empty{padding:32px;text-align:center;color:var(--mut)}

/* ESTILOS DE LA CARTA FUT / FIFA */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.fut-card{width:300px;height:450px;background:linear-gradient(135deg, #e5c07b 0%, #b38728 50%, #fbf5b7 100%);border-radius:18px 18px 90px 90px;padding:18px;color:#222;box-shadow:0 15px 35px rgba(0,0,0,0.6);border:4px solid #fbf5b7;position:relative;font-family:"Barlow Condensed",sans-serif;display:flex;flex-direction:column;justify-content:space-between;transform:scale(0.9);transition:transform .2s ease}
.modal-overlay.active .fut-card{transform:scale(1)}
.fut-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid rgba(0,0,0,0.15);padding-bottom:8px}
.fut-rating-box{text-align:center;line-height:1}
.fut-rating{font-size:3.2rem;font-weight:900;letter-spacing:-1px}
.fut-pos{font-size:1.2rem;font-weight:700;text-transform:uppercase}
.fut-badge{font-size:2.2rem}
.fut-name{text-align:center;font-size:1.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:8px 0;border-bottom:2px solid rgba(0,0,0,0.15);padding-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:0 8px}
.fut-stat-item{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;font-weight:700}
.fut-stat-val{font-size:1.4rem;font-weight:900}
.fut-footer{text-align:center;font-size:0.8rem;font-weight:700;color:rgba(0,0,0,0.6);text-transform:uppercase;margin-top:auto}
.close-btn{position:absolute;top:-12px;right:-12px;background:#000;color:#fff;border:2px solid #fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-weight:bold;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<main>
  <h1>&lt;&lt;&lt;F7-RANKING ROOM&gt;&gt;&gt;</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Modalidad"></div>
  <div class="bar"><span id="orden"></span><input id="q" type="search" placeholder="Buscar jugador" aria-label="Buscar jugador"></div>
  <div class="wrap">
    <table><thead id="head"></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<!-- MODAL CARTA FIFA -->
<div class="modal-overlay" id="modal" onclick="cerrarCarta(event)">
  <div class="fut-card" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="cerrarCartaDirecto()">✕</button>
    <div>
      <div class="fut-header">
        <div class="fut-rating-box">
          <div class="fut-rating" id="card-rat">85</div>
          <div class="fut-pos" id="card-pos">MED</div>
        </div>
        <div class="fut-badge">⚽</div>
      </div>
      <div class="fut-name" id="card-name">JUGADOR</div>
      <div class="fut-stats">
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-ata">80</span> <span>ATA</span></div>
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-def">75</span> <span>DEF</span></div>
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-pas">82</span> <span>PAS</span></div>
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-gk">50</span> <span>POR</span></div>
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-gan">88</span> <span>VIC</span></div>
        <div class="fut-stat-item"><span class="fut-stat-val" id="card-mvp">70</span> <span>MVP</span></div>
      </div>
    </div>
    <div class="fut-footer" id="card-mod">MODALIDAD TOTAL</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const MODS = ["1v1", "2v2", "3v3", "4v4", "5v5", "6v6", "7v7"];
const CON_PORTERO = ["5v5", "6v6", "7v7", "full"];

const ETIQUETA = {
  matches: { icon: "🎮", name: "Partidos Jugados (PJ)" },
  goals: { icon: "⚽", name: "Goles" },
  assists: { icon: "🅰️", name: "Asistencias" },
  ga: { icon: "⚽+🅰️", name: "Goles + Asistencias (G+A)" },
  gpm: { icon: "📊", name: "Promedio de Goles por Partido (G/PJ)" },
  mvp: { icon: "⭐", name: "Premios MVP del partido" },
  passesTotal: { icon: "👟", name: "Pases Totales" },
  passPct: { icon: "🎯", name: "Porcentaje de Pases Acertados (%)" },
  recoveries: { icon: "🛡️", name: "Balones Recuperados / Robos" },
  wins: { icon: "🥇", name: "Victorias" },
  wr: { icon: "📈", name: "Porcentaje de Victorias (% Vict.)" },
  streak: { icon: "🔥", name: "Racha Actual" },
  bestStreak: { icon: "👑", name: "Mejor Racha Histórica" },
  elo: { icon: "🏆", name: "Puntos ELO" },
  saves: { icon: "🧤", name: "Paradas de Portero" },
  cleanSheets: { icon: "🔒", name: "Porterías a Cero" }
};

const ORDEN = {
  goals: "⚽ Goles",
  assists: "🅰️ Asistencias",
  ga: "⚽+🅰️ G+A",
  mvp: "⭐ MVP",
  passesTotal: "👟 Pases",
  passPct: "🎯 % Pases",
  recoveries: "🛡️ Robos",
  matches: "🎮 PJ",
  wins: "🥇 Victorias",
  streak: "🔥 Racha",
  bestStreak: "👑 Mejor Racha",
  elo: "🏆 ELO",
  saves: "🧤 Paradas",
  cleanSheets: "🔒 P. Cero"
};

const BASE = ["matches", "goals", "assists", "ga", "gpm", "mvp", "passesTotal", "passPct", "recoveries", "wins", "wr"];

function columnas(t) {
  if (t === "total") return [...BASE, "bestStreak", "saves", "cleanSheets"];
  return [...BASE, "streak", "bestStreak", "elo", ...(CON_PORTERO.includes(t) ? ["saves", "cleanSheets"] : [])];
}

let data = [], tab = "total", key = "goals", cargando = true, error = "";

const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);

function modsDe(p) {
  return p && p.modalidades && typeof p.modalidades === "object" ? p.modalidades : { antiguo: p || {} };
}

function vista(p, t) {
  const mods = modsDe(p);
  let r;
  if (t === "total") {
    r = { matches: 0, goals: 0, assists: 0, wins: 0, saves: 0, cleanSheets: 0, streak: 0, bestStreak: 0, elo: 0, passesTotal: 0, passesCompleted: 0, recoveries: 0, mvp: 0 };
    for (const m of Object.values(mods)) {
      for (const k of ["matches", "goals", "assists", "wins", "saves", "cleanSheets", "passesTotal", "passesCompleted", "recoveries", "mvp"]) r[k] += num(m[k]);
      r.streak = Math.max(r.streak, num(m.streak));
      r.bestStreak = Math.max(r.bestStreak, num(m.bestStreak));
    }
  } else {
    const m = mods[t];
    if (!m) return null;
    r = {
      matches: num(m.matches), goals: num(m.goals), assists: num(m.assists), wins: num(m.wins),
      saves: num(m.saves), cleanSheets: num(m.cleanSheets), streak: num(m.streak), bestStreak: num(m.bestStreak),
      elo: m.elo == null ? 1000 : num(m.elo),
      passesTotal: num(m.passesTotal), passesCompleted: num(m.passesCompleted), recoveries: num(m.recoveries),
      mvp: num(m.mvp)
    };
  }
  if (!(r.matches || r.goals || r.assists || r.wins || r.saves || r.cleanSheets || r.passesTotal || r.recoveries || r.mvp)) return null;
  r.name = String(p && p.name != null ? p.name : "?");
  r.ga = r.goals + r.assists;
  r.gpm = r.matches ? r.goals / r.matches : 0;
  r.wr = r.matches ? (r.wins / r.matches) * 100 : 0;
  r.passPct = r.passesTotal ? Math.round((r.passesCompleted / r.passesTotal) * 100) : 0;
  return r;
}

function fmt(k, v) { 
  if (k === "gpm") return v.toFixed(2);
  if (k === "wr" || k === "passPct") return Math.round(v) + "%";
  return v; 
}

function tabsDisponibles() {
  const lista = [...MODS];
  if (data.some((p) => modsDe(p).full)) lista.push("full");
  lista.push("total");
  return lista;
}

const nombreTab = (t) => (t === "total" ? "Total" : t);

function pintarTabs() {
  const cont = $("tabs"); cont.textContent = "";
  tabsDisponibles().forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(t === tab));
    b.textContent = nombreTab(t);
    b.addEventListener("click", () => elegirTab(t));
    cont.append(b);
  });
}

function pintarOrden(cols) {
  const cont = $("orden"); cont.textContent = "";
  Object.keys(ORDEN).filter((k) => cols.includes(k)).forEach((k) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-pressed", String(k === key));
    b.textContent = ORDEN[k];
    b.addEventListener("click", () => { key = k; render(); });
    cont.append(b);
  });
}

function elegirTab(t) {
  tab = t;
  if (typeof location !== "undefined") location.hash = t;
  render();
}

function abrirCarta(pData) {
  const pj = pData.matches || 1;

  // Fórmulas Ponderadas sobre 100 por partido
  const ata = Math.min(99, Math.round(((pData.ga / pj) / 1.5) * 100));
  const def = Math.min(99, Math.round(((pData.recoveries / pj) / 4) * 100));
  const pas = Math.min(99, Math.round((pData.passPct * 0.6) + (Math.min(1, (pData.passesTotal / pj) / 15) * 40)));
  const por = pData.saves > 0 ? Math.min(99, Math.round(((pData.saves / pj) / 3) * 70 + ((pData.cleanSheets / pj) * 30))) : 50;
  const gan = Math.min(99, Math.round((pData.wr * 0.7) + (Math.min(10, pData.bestStreak) * 3)));
  const mvp = Math.min(99, Math.round(((pData.mvp / pj) / 0.5) * 100));

  // Rating General Promedio
  const rat = Math.round((ata + def + pas + gan + mvp) / 5);

  // Posición estimada
  let pos = "MED";
  if (ata > def && ata > por) pos = "DEL";
  else if (def > ata && def > por) pos = "DEF";
  else if (por > 65) pos = "POR";

  $("card-name").textContent = pData.name;
  $("card-rat").textContent = rat;
  $("card-pos").textContent = pos;
  $("card-ata").textContent = ata;
  $("card-def").textContent = def;
  $("card-pas").textContent = pas;
  $("card-gk").textContent = por;
  $("card-gan").textContent = gan;
  $("card-mvp").textContent = mvp;
  $("card-mod").textContent = "MODALIDAD " + nombreTab(tab).toUpperCase();

  $("modal").classList.add("active");
}

function cerrarCarta(e) {
  if (e.target.id === "modal") $("modal").classList.remove("active");
}

function cerrarCartaDirecto() {
  $("modal").classList.remove("active");
}

function render() {
  if (!tabsDisponibles().includes(tab)) tab = "total";
  const cols = columnas(tab);
  if (!cols.includes(key) || !ORDEN[key]) key = "goals";
  pintarTabs();
  pintarOrden(cols);

  const q = $("q").value.trim().toLowerCase();
  const todos = data.map((p) => vista(p, tab)).filter(Boolean);
  const list = todos.filter((p) => p.name.toLowerCase().includes(q))
    .sort((a, b) => b[key] - a[key] || b.ga - a.ga || a.name.localeCompare(b.name));
  const max = Math.max(1, ...list.map((p) => p[key]));

  const head = $("head"); head.textContent = "";
  const hr = document.createElement("tr");
  
  const thPos = document.createElement("th"); thPos.textContent = "#"; hr.append(thPos);
  const thName = document.createElement("th"); thName.textContent = "Jugador"; hr.append(thName);

  cols.forEach((c) => {
    const th = document.createElement("th");
    const item = ETIQUETA[c];
    const abbr = document.createElement("abbr");
    abbr.title = item.name;
    abbr.textContent = item.icon;
    th.append(abbr);
    hr.append(th);
  });
  head.append(hr);

  const tb = $("rows"); tb.textContent = "";
  list.forEach((p, i) => {
    const tr = document.createElement("tr");
    if (i < 3 && p[key] > 0) tr.className = "top";
    const pos = document.createElement("td"); pos.className = "pos"; pos.textContent = i + 1; tr.append(pos);
    
    const nm = document.createElement("td"); nm.className = "name"; nm.textContent = p.name;
    nm.title = "Haz clic para ver la carta FIFA de " + p.name;
    nm.addEventListener("click", () => abrirCarta(p));
    
    const bar = document.createElement("i"); bar.style.width = (p[key] / max) * 100 + "%"; nm.append(bar); tr.append(nm);
    cols.forEach((k) => { 
      const td = document.createElement("td"); 
      td.textContent = fmt(k, p[k]); 
      if (k === key) td.className = "key"; 
      tr.append(td); 
    });
    tb.append(tr);
  });

  const vacio = $("empty");
  vacio.hidden = list.length > 0;
  vacio.textContent = cargando ? "Cargando…"
    : error && data.length === 0 ? error
    : data.length === 0 ? "Aún no hay partidas registradas. Juega una partida completa en la sala y aparecerá aquí."
    : todos.length === 0 ? "Todavía no hay datos en esta modalidad." : "Ningún jugador coincide con la búsqueda.";

  $("sub").textContent = cargando ? "Cargando…"
    : error && data.length === 0 ? "No se pudieron cargar las estadísticas"
    : todos.length + (todos.length === 1 ? " jugador · " : " jugadores · ") + todos.reduce((s, p) => s + p.goals, 0) + " goles registrados · " +
      (tab === "total" ? "Total (todas las modalidades)" : "Modalidad " + tab) + (error ? " · (no se pudo actualizar)" : "");
}

function tabDeHash() {
  const h = (typeof location !== "undefined" ? location.hash : "").replace("#", "");
  return h === "total" || MODS.includes(h) || h === "full" ? h : null;
}

function mensajeError(e) {
  if (typeof location !== "undefined" && location.protocol === "file:") {
    return "Estás abriendo el archivo directamente (doble clic) y el navegador no deja leer stats.json. Ábrelo desde http://localhost:3000 con el bot en marcha, o desde la web publicada en GitHub.";
  }
  return "No se pudo leer stats.json (" + (e && e.message ? e.message : "error") + "). Comprueba que está en la misma carpeta que index.html.";
}

async function load() {
  try {
    const r = await fetch("stats.json?t=" + Date.now());
    if (!r.ok) throw new Error("error HTTP " + r.status);
    let json;
    try { json = await r.json(); } catch (e) { throw new Error("el archivo no es un JSON válido"); }
    data = Array.isArray(json) ? json : (json && typeof json === "object" ? Object.values(json) : []);
    error = "";
  } catch (e) {
    error = mensajeError(e);
  }
  cargando = false;
  render();
}

$("q").addEventListener("input", render);
window.addEventListener("hashchange", () => { const t = tabDeHash(); if (t && t !== tab) { tab = t; render(); } });
tab = tabDeHash() || "total";
render();
load(); setInterval(load, 30000);
</script>
</body>
</html>
