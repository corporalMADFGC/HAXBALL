<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F7 Ranking Room - Temporada 1</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f1b2d;--mut:#5b6b80;--line:#cbd5e1;--blue:#1e5bb8;--gold:#b07800;--red:#dc2626;--green:#16a34a;--soft:#f3f6fa;--tr:#ef4444;--tb:#3b82f6}
@media(prefers-color-scheme:dark){:root{--bg:#0d1624;--card:#142033;--ink:#e8eef6;--mut:#93a4ba;--line:#26364d;--blue:#6aa3ff;--gold:#f0b429;--red:#ef4444;--green:#22c55e;--soft:#1a2a42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px 12px 64px}
button,select,input{font:inherit}

/* HERO */
.hero{background:linear-gradient(135deg,#0b2a5b 0%,#1e5bb8 55%,#0f1b2d 100%);color:#fff;border-radius:14px;padding:20px 18px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(11,42,91,.25)}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(1.8rem,6vw,3rem);line-height:1;margin:0 0 4px;font-weight:700;letter-spacing:.5px}
.sub{color:rgba(255,255,255,.8);margin:0 0 14px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.kpi span{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;opacity:.8}
.countdown{display:inline-block;margin:0 0 12px;padding:8px 12px;border-radius:10px;font-size:.92rem;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.countdown.fin{background:rgba(240,180,41,.25);border-color:rgba(240,180,41,.6)}

.time-bar,.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.time-bar button,.tabs button{flex:0 0 auto;font-size:.85rem;font-weight:600;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;transition:transform .1s}
.time-bar button:hover,.tabs button:hover{transform:translateY(-1px)}
.time-bar button[aria-selected=true],.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs button.tab-partidos{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.tabs button.tab-partidos[aria-selected=false]{opacity:.75}

/* BARRA DE CONTROLES */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.bar input{flex:1;min-width:150px;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mut);font-weight:600}
.ctl select{font-size:.85rem;padding:6px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-weight:600}
.ctl button{font-size:.85rem;font-weight:700;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}

/* PODIO */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;align-items:end}
.pod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.pod::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.pod.p1{--c:#f0b429;padding-top:18px;box-shadow:0 6px 18px rgba(240,180,41,.25)}
.pod.p2{--c:#94a3b8}
.pod.p3{--c:#c2763a}
.pod .medal{font-size:1.5rem;line-height:1}
.pod .av{width:46px;height:46px;border-radius:50%;margin:6px auto;background:var(--c);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800}
.pod .pn{font-weight:700;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pv{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.9rem;font-weight:700;line-height:1.1;color:var(--blue)}
.pod .pl{font-size:.68rem;text-transform:uppercase;color:var(--mut);letter-spacing:.5px}
.pod .ps{font-size:.72rem;color:var(--mut);margin-top:2px}

/* TABLA */
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:980px;font-size:.84rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--mut);font-size:.8rem;background:var(--soft);user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--ink)}
th.sorted,td.sorted{color:var(--blue);background:rgba(30,91,184,.08)}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.pos{color:var(--mut);width:1%;font-weight:700;text-align:center}
tr.top td.pos{color:var(--gold)}
td.name{font-weight:600;cursor:pointer;color:var(--blue)}
td.name:hover .nm{text-decoration:underline}
.avs{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;margin-right:8px;vertical-align:middle}
.bar-wr{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}
.bar-wr i{display:block;height:100%;background:var(--green)}
.empty{padding:32px;text-align:center;color:var(--mut)}

/* PARTIDOS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{font-size:.78rem;font-weight:700;padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--soft);font-size:.78rem;color:var(--mut)}
.badge{background:var(--blue);color:#fff;font-weight:800;border-radius:6px;padding:2px 8px;font-size:.75rem}
.mscore{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 4px;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.mscore .t{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mscore .n{font-size:2.6rem;font-weight:700;line-height:1}
.mscore .r{color:var(--tr)}.mscore .b{color:var(--tb)}
.mscore .w{text-decoration:underline;text-underline-offset:4px}
.mscore .dash{color:var(--mut);font-size:1.6rem}
.res{text-align:center;font-size:.72rem;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.mvpbar{margin:4px 12px 8px;padding:6px 10px;border-radius:8px;background:linear-gradient(90deg,rgba(240,180,41,.25),rgba(240,180,41,.05));border:1px solid rgba(240,180,41,.5);font-size:.85rem;font-weight:700;text-align:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.team{background:var(--card);padding:6px 8px 8px}
.team h4{margin:2px 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid currentColor;padding-bottom:3px}
.team.red h4{color:var(--tr)}.team.blue h4{color:var(--tb)}
.pl{padding:5px 4px;border-radius:6px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.pl.mvp{background:rgba(240,180,41,.18)}
.pl.out{opacity:.55}
.pl .pn{font-weight:700;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pp{font-weight:800;font-size:.85rem;color:var(--gold);text-align:right}
.pl .ch{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px 8px;font-size:.72rem;color:var(--mut)}
.more{display:block;margin:14px auto 0;padding:8px 20px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-weight:700;cursor:pointer}
@media(max-width:560px){.teams{grid-template-columns:1fr}.podium{gap:6px}.pod .pv{font-size:1.5rem}}

/* MODAL CARTA FIFA Y PES ROMBO */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.fut-card-gold{width:320px;height:490px;background:radial-gradient(circle, #f9e29c 0%, #d4a743 60%, #a67c1e 100%);border-radius:18px;padding:16px;color:#111;position:relative;display:flex;flex-direction:column;justify-content:space-between;border:3px solid #fbe59d;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.close-btn{position:absolute;top:-12px;right:-12px;background:#000;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-weight:bold;border:2px solid #fff}
.card-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(0,0,0,0.15);padding-bottom:8px}
.card-ovr{font-size:2.8rem;font-weight:900;line-height:1;margin:0}
.card-avatar{width:50px;height:50px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;border:2px solid #fff}
.pes-hexagon-container{display:flex;justify-content:center;align-items:center;margin:8px 0}
.card-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:0.8rem;font-weight:bold;background:rgba(255,255,255,0.3);padding:8px;border-radius:8px}

/* VENTANA DE PUNTOS POR PARTIDO (estilo Mister) */
.pl.clicable{cursor:pointer}
.pl.clicable:hover{background:var(--soft)}
.pl.clicable.mvp:hover{background:rgba(240,180,41,.3)}
.pts-box{position:relative;width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden}
.pts-box .close-btn{top:10px;right:10px}
.pts-head{padding:16px 18px 12px;background:linear-gradient(135deg,#0b2a5b,#1e5bb8);color:#fff}
.pts-head h3{margin:0 40px 2px 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;line-height:1.1;text-transform:uppercase;letter-spacing:.5px}
.pts-head .per{font-size:.74rem;opacity:.8;text-transform:uppercase;letter-spacing:.6px}
.pts-resumen{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);text-align:center}
.pts-resumen b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.35rem;line-height:1.1}
.pts-resumen span{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.pts-leyenda{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px 12px 0;font-size:.7rem;color:var(--mut);font-weight:600}
.pts-leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pts-chart-wrap{overflow-x:auto;padding:12px 12px 6px}
.pts-chart{display:flex;gap:8px;align-items:flex-start;width:max-content;margin:0 auto}
.pts-col{width:44px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:10px;padding:0 2px 6px;outline:none}
.pts-col:hover,.pts-col:focus-visible{background:var(--soft)}
.pts-col.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--line)}
.pts-zona{height:210px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.pts-barra{position:relative;width:32px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 4%,transparent))}
.pts-barra .bd{position:absolute;top:0;left:0;right:0;padding:3px 0;border-radius:7px;background:var(--c);color:#fff;font-weight:800;font-size:.85rem;line-height:1.15;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pts-sinpts{width:32px;padding-bottom:6px;text-align:center;font-size:1.1rem;color:var(--mut)}
.am{--c:#f5c518}.am .bd{color:#2b2200}
.ve{--c:#22a84a}
.az{--c:#1e6fe0}
.ro{--c:#dc2626}
.pts-ico{height:78px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px;font-size:.85rem;line-height:1}
.pts-ico small{font-size:.65rem;font-weight:800;color:var(--mut)}
.pts-lbl{font-weight:800;font-size:.74rem;color:var(--mut)}
.pts-mod{font-size:.58rem;color:var(--mut);opacity:.8;text-transform:uppercase}
.pts-detalle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:.85rem;min-height:58px}
.pts-detalle .f{color:var(--mut);font-size:.78rem}
.pts-detalle .m{font-weight:700}
.pts-detalle .m .r{color:var(--tr)}.pts-detalle .m .b{color:var(--tb)}
.pts-detalle .ga{font-weight:700}
.pts-res{font-weight:800;font-size:.7rem;padding:1px 7px;border-radius:5px;color:#fff}
.pts-res.v{background:var(--green)}.pts-res.d{background:var(--red)}.pts-res.e{background:#64748b}
.pts-pill{font-weight:800;font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--c);color:#fff}
.pts-pill.am{color:#2b2200}
.pts-pill.na{background:#94a3b8}
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>&lt;&lt;&lt;F7-RANKING ROOM&gt;&gt;&gt;</h1>
    <p class="sub" id="sub">Cargando…</p>
    <div class="countdown" id="countdown"></div>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="time-bar" id="time-bar" role="tablist"></div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="bar" id="search-bar">
    <input id="q" type="search" placeholder="Buscar jugador..." oninput="resetLimite();render()">
    <div class="ctl" id="sort-ctl">
      <label>Ordenar por <select id="sortKey" onchange="cambiarOrden(this.value)"></select></label>
      <button type="button" id="sortDir" onclick="toggleDir()" title="Cambiar sentido">↓ Mayor a menor</button>
      <label>Mín. partidos
        <select id="minPJ" onchange="minPJ=+this.value;render()">
          <option value="0">0</option><option value="3">3</option><option value="5">5</option><option value="10">10</option>
        </select>
      </label>
    </div>
  </div>

  <div class="podium" id="podium"></div>

  <div class="wrap" id="wrap-ranking">
    <table><thead id="head"></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty" hidden>No se encontraron registros en este periodo.</div>
  </div>

  <div id="matches-view" hidden>
    <div class="chips" id="mod-chips"></div>
    <div class="mgrid" id="mgrid"></div>
    <div class="empty" id="empty-m" hidden>No hay partidos en este periodo.</div>
    <button type="button" class="more" id="more" hidden onclick="matchLimit+=20;render()">Ver más partidos</button>
  </div>
</main>

<div class="modal-overlay" id="modal" onclick="$('modal').classList.remove('active')">
  <div style="position:relative" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="$('modal').classList.remove('active')">✕</button>
    <div class="fut-card-gold">
      <div class="card-header">
        <div>
          <div class="card-ovr" id="card-ovr">--</div>
          <div style="font-size:0.75rem;font-weight:bold;text-transform:uppercase">MEDIA OVR</div>
        </div>
        <h2 id="card-name" style="margin:0;font-size:1.4rem;text-transform:uppercase;text-align:right">JUGADOR</h2>
        <div class="card-avatar" id="card-avatar">--</div>
      </div>

      <!-- Hexágono estilo PES 6 -->
      <div class="pes-hexagon-container">
        <svg width="170" height="150" viewBox="0 0 200 180" id="pes-svg"></svg>
      </div>

      <div class="card-stats-grid" id="card-info"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-pts" onclick="cerrarPuntos()">
  <div class="pts-box" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="pts-nombre">
    <button class="close-btn" onclick="cerrarPuntos()" aria-label="Cerrar">✕</button>
    <div class="pts-head">
      <h3 id="pts-nombre">JUGADOR</h3>
      <div class="per" id="pts-periodo"></div>
    </div>
    <div class="pts-resumen" id="pts-resumen"></div>
    <div class="pts-leyenda">
      <span><i style="background:#f5c518"></i>0 – 4</span>
      <span><i style="background:#22a84a"></i>5 – 9</span>
      <span><i style="background:#1e6fe0"></i>10 o más</span>
    </div>
    <div class="pts-chart-wrap" id="pts-chart-wrap"><div class="pts-chart" id="pts-chart"></div></div>
    <div class="pts-detalle" id="pts-detalle"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TABS_LISTA = ["total", "1v1", "2v2", "3v3", "4v4", "5v5", "6v6", "7v7", "full", "partidos"];

let dbGlobal = { jugadores: {}, partidaHistorial: [] };
// "temp1" = temporada en curso (se llama así por compatibilidad; el número real es temporadaNum).
// "arch:N" = temporada N ya cerrada, leída de temporada-N.json.
let tiempoFiltro = "temp1";
let tab = "total";
let cargando = true;

// Temporada en curso. stats.json puede sobrescribir estos valores con { temporada: 2, temporadaFin: "2027-05-01T00:00:00+02:00" }
let temporadaNum = 1;
let temporadaFin = new Date("2027-02-01T00:00:00+01:00").getTime();   // 1 feb 2027, hora de España
const dbArchivo = {};          // temporadas cerradas: { 1: { jugadores, partidaHistorial } }
const archivoIntentado = {};

// Ordenación del ranking
let sortKey = "elo";
let sortDir = -1;          // -1 = mayor a menor, 1 = menor a mayor
let minPJ = 0;
// Vista de partidos
let matchMod = "todas";
let matchLimit = 20;

// Columnas de la tabla (k = campo por el que se puede ordenar)
const COLS = [
  { k: "ovr", t: "OVR" }, { k: "matches", t: "PJ" }, { k: "wins", t: "V" }, { k: "winPct", t: "% V" },
  { k: "goals", t: "Goles" }, { k: "assists", t: "Asist." }, { k: "ga", t: "G+A" },
  { k: "saves", t: "Paradas" }, { k: "recoveries", t: "Robos" }, { k: "passPct", t: "Pases (%)" },
  { k: "mvp", t: "MVP" }, { k: "elo", t: "ELO" }
];
// Opciones del selector (las columnas + algunas extra)
const SORT_OPTS = [
  { k: "elo", t: "ELO" }, { k: "ovr", t: "OVR (media)" }, { k: "matches", t: "Partidos jugados" },
  { k: "wins", t: "Victorias" }, { k: "winPct", t: "% de victorias" },
  { k: "goals", t: "Goles" }, { k: "assists", t: "Asistencias" }, { k: "ga", t: "Goles + Asistencias" },
  { k: "gpm", t: "Goles por partido" }, { k: "mvp", t: "MVP" },
  { k: "saves", t: "Paradas" }, { k: "cleanSheets", t: "Porterías a cero" },
  { k: "recoveries", t: "Robos" }, { k: "passPct", t: "% de pases" }
];

function resetLimite() { matchLimit = 20; }

function esTemporada() { return tiempoFiltro === "temp1" || tiempoFiltro.startsWith("arch:"); }
function dbActiva() {
  if (tiempoFiltro.startsWith("arch:")) return dbArchivo[tiempoFiltro.slice(5)] || { jugadores: {}, partidaHistorial: [] };
  return dbGlobal;
}
function nombrePeriodo() {
  if (tiempoFiltro === "temp1") return "Temporada " + temporadaNum;
  if (tiempoFiltro.startsWith("arch:")) return "Temporada " + tiempoFiltro.slice(5);
  return tiempoFiltro;
}

function elegirTiempo(t) {
  tiempoFiltro = t;
  matchLimit = 20;
  render();
}

function pintarTiempo() {
  const cont = $("time-bar"); cont.textContent = "";
  const items = [["diario", "📅 Diario"], ["semanal", "📅 Semanal"], ["mensual", "📅 Mensual"], ["temp1", "🏆 Temporada " + temporadaNum]];
  Object.keys(dbArchivo).map(Number).sort((a, b) => a - b).forEach(n => items.push(["arch:" + n, "📁 Temporada " + n]));
  items.forEach(([k, t]) => {
    const b = el("button", null, t);
    b.type = "button";
    b.setAttribute("aria-selected", String(k === tiempoFiltro));
    b.addEventListener("click", () => elegirTiempo(k));
    cont.append(b);

// ---------- Utilidades de partidos ----------
function ganadorEquipo(p) {            // 1 = rojo, 2 = azul, 0 = empate
  if (p.marcador) {
    const r = +p.marcador.red || 0, b = +p.marcador.blue || 0;
    return r === b ? 0 : (r > b ? 1 : 2);
  }
  const x = (p.participantes || []).find(q => q.ganador != null);   // partidos antiguos sin marcador
  return x ? (x.ganador || 0) : 0;
}
function durSeg(p) { return p.duracion != null ? p.duracion : (p.duracionSegundos || 0); }
function mvpDelPartido(p) {            // misma regla que el bot: mayor puntosMVP, sin 1v1 ni abandonos
  if (p.modalidad === "1v1") return null;
  let mejor = null, max = 0;
  (p.participantes || []).forEach(pt => {
    if (pt.abandono) return;
    if ((pt.puntosMVP || 0) > max) { max = pt.puntosMVP; mejor = pt; }
  });
  return mejor;
}
function partidosPeriodo() {
  const historial = dbActiva().partidaHistorial || [];
  if (esTemporada()) return historial;
  const ms = tiempoFiltro === "diario" ? 864e5 : tiempoFiltro === "semanal" ? 7 * 864e5 : 30 * 864e5;
  const ahora = Date.now();
  return historial.filter(p => (ahora - p.timestamp) <= ms);
}
function fmtDur(s) { return s ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : "-"; }
function fmtPts(n) { return (Math.round(n * 10) / 10).toString(); }

function procesarDatosFiltrados() {
  const db = dbActiva();
  const jugOriginales = db.jugadores || {};
  const historial = db.partidaHistorial || [];

  if (esTemporada() || historial.length === 0) {
    return Object.values(jugOriginales);
  }

  const mapaJugadores = {};
  partidosPeriodo().forEach(partido => {
    const mod = partido.modalidad;
    const gan = ganadorEquipo(partido);
    const mvp = mvpDelPartido(partido);
    (partido.participantes || []).forEach(p => {
      if (p.abandono) return;          // el bot no cuenta los abandonos
      const k = p.auth || p.name;
      if (!mapaJugadores[k]) {
        mapaJugadores[k] = { name: p.name, avatar: p.name.substring(0, 2).toUpperCase(), modalidades: {} };
      }
      if (!mapaJugadores[k].modalidades[mod]) {
        mapaJugadores[k].modalidades[mod] = { matches: 0, wins: 0, goals: 0, assists: 0, ownGoals: 0, elo: 1000, saves: 0, cleanSheets: 0, passesTotal: 0, passesCompleted: 0, recoveries: 0, mvp: 0 };
      }
      const m = mapaJugadores[k].modalidades[mod];
      m.matches++;
      m.goals += (p.goals || 0);
      m.assists += (p.assists || 0);
      m.ownGoals += (p.ownGoals || 0);
      m.saves += (p.saves || 0);
      m.recoveries += (p.recoveries || 0);
      m.passesTotal += (p.passesTotal || 0);
      m.passesCompleted += (p.passesCompleted || 0);
      if (p.cleanSheet) m.cleanSheets++;
      if (mvp === p) m.mvp++;
      if (gan && p.team === gan) { m.wins++; m.elo += 25; }
    });
  });

  return Object.values(mapaJugadores);
}

function calcularAtributosPES(r) {
  const pj = Math.max(1, r.matches);
  const att = Math.min(99, Math.round(40 + ((r.goals * 1.5 + r.assists) / pj) * 25));
  // DEF: acciones defensivas por partido con curva de saturación (rendimientos decrecientes).
  // Antes era lineal (x20): con ~3 robos por partido ya se llegaba al tope de 99 y todos salían iguales.
  // Con DEF_K = 14: 5 acc/partido ≈ 62, 10 ≈ 71, 20 ≈ 85, 35 ≈ 94.
  // Si todos salen altos, sube DEF_K; si salen bajos, bájalo.
  const DEF_K = 14;
  const defAcciones = (r.recoveries + r.saves * 1.2 + r.cleanSheets * 3) / pj;
  const def = Math.min(99, Math.max(40, Math.round(40 + 59 * (1 - Math.exp(-defAcciones / DEF_K)))));
  // PAS: combina precisión de pase y volumen de pases completados por partido.
  // Si no hay pases registrados, parte de 40 y no inventa un porcentaje del 50%.
  const passPct = r.passesTotal > 0 ? (r.passesCompleted / r.passesTotal) : 0;
  const passesPerMatch = r.passesCompleted / pj;
  const pas = Math.min(99, Math.max(40, Math.round(40 + passPct * 40 + Math.min(19, passesPerMatch * 5))));
  const mvpAttr = Math.min(99, Math.max(40, Math.round(40 + (r.mvp / pj) * 50 + (r.bestStreak || 0) * 3)));
  // EXP progresa de forma gradual: evita llegar a 99 con apenas unos 20 partidos.
  const exp = Math.min(99, Math.round(40 + 12 * Math.log(pj + 1)));
  const men = Math.min(99, Math.max(40, Math.round(40 + (r.elo - 800) / 10)));
  const eloContrib = Math.max(40, 50 + (r.elo - 1000) / 15);
  const winRateContrib = ((r.wins / pj) * 30) + 50;
  const outputContrib = Math.min(99, 40 + ((r.goals + r.assists) / pj) * 25);
  const ovr = Math.min(99, Math.round((eloContrib * 0.4) + (winRateContrib * 0.3) + (outputContrib * 0.3)));
  return { att, def, pas, mvpAttr, exp, men, ovr };
}

function generarSVGRomboPES(stats) {
  const cx = 100, cy = 90, r = 65;
  const labels = ["ATT", "PAS", "MVP", "DEF", "EXP", "MEN"];
  const vals = [stats.att, stats.pas, stats.mvpAttr, stats.def, stats.exp, stats.men];
  
  let gridLines = "";
  for (let level = 0.25; level <= 1; level += 0.25) {
    let pts = [];
    for (let i = 0; i < 6; i++) {
      let angle = (Math.PI / 3) * i - Math.PI / 2;
      pts.push(`${cx + r * level * Math.cos(angle)},${cy + r * level * Math.sin(angle)}`);
    }
    gridLines += `<polygon points="${pts.join(" ")}" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>`;
  }

  let polyPts = [];
  let labelTags = "";
  for (let i = 0; i < 6; i++) {
    let angle = (Math.PI / 3) * i - Math.PI / 2;
    let factor = Math.max(0.2, vals[i] / 100);
    let px = cx + r * factor * Math.cos(angle);
    let py = cy + r * factor * Math.sin(angle);
    polyPts.push(`${px},${py}`);

    let lx = cx + (r + 18) * Math.cos(angle);
    let ly = cy + (r + 18) * Math.sin(angle);
    labelTags += `<text x="${lx}" y="${ly + 4}" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">${labels[i]} ${vals[i]}</text>`;
  }

  return `${gridLines}<polygon points="${polyPts.join(" ")}" fill="rgba(30,91,184,0.5)" stroke="#1e5bb8" stroke-width="2"/>${labelTags}`;
}

function obtenerVistaJugador(p, modo) {
  const mods = p.modalidades || {};
  let targetKeys = modo === "total" ? Object.keys(mods) : [modo];
  let r = { 
    matches: 0, wins: 0, goals: 0, assists: 0, ownGoals: 0, 
    saves: 0, cleanSheets: 0, passesTotal: 0, passesCompleted: 0, 
    recoveries: 0, mvp: 0, streak: 0, bestStreak: 0, elo: 1000 
  };
  let totalElo = 0, countElo = 0, maxStreak = 0;

  targetKeys.forEach(mKey => {
    const m = mods[mKey];
    if (!m) return;
    r.matches += (m.matches || 0);
    r.wins += (m.wins || 0);
    r.goals += (m.goals || 0);
    r.assists += (m.assists || 0);
    r.ownGoals += (m.ownGoals || 0);
    r.saves += (m.saves || 0);
    r.cleanSheets += (m.cleanSheets || 0);
    r.passesTotal += (m.passesTotal || 0);
    r.passesCompleted += (m.passesCompleted || 0);
    r.recoveries += (m.recoveries || 0);
    r.mvp += (m.mvp || 0);
    if ((m.bestStreak || 0) > maxStreak) maxStreak = m.bestStreak;
    if (m.elo != null) { totalElo += m.elo; countElo++; }
  });

  r.elo = countElo > 0 ? Math.round(totalElo / countElo) : 1000;
  r.bestStreak = maxStreak;
  if (!r.matches && !r.goals && !r.wins) return null;
  r.name = p.name;
  r.avatar = p.avatar || p.name.substring(0, 2).toUpperCase();
  
  const calc = calcularAtributosPES(r);
  r.pes = calc;
  r.ovr = calc.ovr;
  return r;
}

// Campos derivados para ordenar (no toca obtenerVistaJugador)
function derivar(v) {
  v.winPct = v.matches ? Math.round((v.wins / v.matches) * 100) : 0;
  v.ga = v.goals + v.assists;
  v.gpm = v.matches ? Math.round((v.goals / v.matches) * 100) / 100 : 0;
  v.passPct = v.passesTotal > 0 ? Math.round((v.passesCompleted / v.passesTotal) * 100) : -1;
  return v;
}

// ---------- Ventana de puntos por partido (estilo Mister) ----------
// Puntos = puntosMVP que calcula el bot (no existen en 1v1 ni si el jugador abandonó).
// Colores: 0-4 amarillo, 5-9 verde, 10 o más azul (negativos en rojo, como en Mister).
function claseBolaPuntos(n) {
  if (n < 0) return "ro";
  if (n < 5) return "am";
  if (n < 10) return "ve";
  return "az";
}

function cerrarPuntos() { $("modal-pts").classList.remove("active"); }

function abrirPuntosJugador(nombre) {
  const partidos = partidosPeriodo().filter(p => (p.participantes || []).some(x => x.name === nombre));   // orden cronológico
  const datos = partidos.map((p, i) => {
    const x = p.participantes.find(q => q.name === nombre);
    const tienePts = p.modalidad !== "1v1" && typeof x.puntosMVP === "number" && !x.abandono;
    return { p, x, n: i + 1, gan: ganadorEquipo(p), pts: tienePts ? Math.round(x.puntosMVP * 10) / 10 : null };
  });

  let total = 0, conPuntos = 0, goles = 0, asist = 0, jugados = 0;
  datos.forEach(d => {
    if (d.x.abandono) return;
    jugados++; goles += (d.x.goals || 0); asist += (d.x.assists || 0);
    if (d.pts != null) { total += d.pts; conPuntos++; }
  });

  // Iconos apilados bajo la barra (hasta 4; a partir de 5 un icono con "×n")
  const iconos = (cont, emoji, n) => {
    if (!n) return;
    if (n <= 4) { for (let i = 0; i < n; i++) cont.append(el("span", null, emoji)); }
    else { cont.append(el("span", null, emoji), el("small", null, "×" + n)); }
  };

  const ZONA = 210, MIN_BARRA = 30;
  // alto del bloque de iconos = el de la columna que más iconos apila (así todas las etiquetas quedan alineadas)
  const nIconos = (n) => (n ? (n <= 4 ? n : 2) : 0);
  const maxIconos = Math.max(0, ...datos.map(d => d.x.abandono ? 0 : nIconos(d.x.goals || 0) + nIconos(d.x.assists || 0) + nIconos(d.x.ownGoals || 0)));
  const altoIconos = Math.max(40, maxIconos * 19 + 10);
  const maxPts = Math.max(10, ...datos.map(d => d.pts || 0));
  const chart = $("pts-chart"); chart.textContent = "";
  const detalle = $("pts-detalle");
  const cols = [];

  const seleccionar = (d, col) => {
    cols.forEach(c => c.classList.remove("sel"));
    col.classList.add("sel");
    detalle.textContent = "";
    const { p, x } = d;
    detalle.append(el("span", "badge", (p.modalidad || "N/D").toUpperCase()));
    detalle.append(el("span", "f", `P${d.n} · ${new Date(p.timestamp).toLocaleString()}`));
    if (p.marcador) {
      const m = el("span", "m"); m.append(el("span", "r", "Rojo " + p.marcador.red), document.createTextNode(" - "), el("span", "b", p.marcador.blue + " Azul"));
      detalle.append(m);
      if (x.abandono) detalle.append(el("span", "f", "Abandonó"));
      else { const r = d.gan === 0 ? "e" : (d.gan === x.team ? "v" : "d"); detalle.append(el("span", "pts-res " + r, r === "v" ? "VICTORIA" : r === "d" ? "DERROTA" : "EMPATE")); }
    }
    detalle.append(el("span", "ga", `⚽ ${x.goals || 0}   🅰️ ${x.assists || 0}` + (x.ownGoals ? `   🥅 ${x.ownGoals} pp` : "")));
    detalle.append(el("span", "pts-pill " + (d.pts != null ? claseBolaPuntos(d.pts) : "na"), d.pts != null ? fmtPts(d.pts) + " pts" : (x.abandono ? "Sin puntos (abandono)" : "Sin puntos en 1v1")));
  };

  datos.forEach(d => {
    const col = el("div", "pts-col");
    col.tabIndex = 0;
    col.setAttribute("role", "button");
    col.title = `P${d.n} · ${(d.p.modalidad || "").toUpperCase()} · ${new Date(d.p.timestamp).toLocaleDateString()}`;

    const zona = el("div", "pts-zona");
    if (d.pts != null) {
      const h = d.pts <= 0 ? MIN_BARRA : Math.max(MIN_BARRA, Math.round((d.pts / maxPts) * ZONA));
      const barra = el("div", "pts-barra " + claseBolaPuntos(d.pts));
      barra.style.height = h + "px";
      barra.append(el("div", "bd", fmtPts(d.pts)));
      zona.append(barra);
    } else {
      zona.append(el("div", "pts-sinpts", d.x.abandono ? "⊘" : "–"));
    }
    const ico = el("div", "pts-ico");
    ico.style.height = altoIconos + "px";
    if (!d.x.abandono) { iconos(ico, "⚽", d.x.goals || 0); iconos(ico, "🅰️", d.x.assists || 0); iconos(ico, "🥅", d.x.ownGoals || 0); }

    col.append(zona, ico, el("div", "pts-lbl", "P" + d.n), el("div", "pts-mod", d.p.modalidad || ""));
    const sel = () => seleccionar(d, col);
    col.addEventListener("click", sel);
    col.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel(); } });
    cols.push(col);
    chart.append(col);
  });

  $("pts-nombre").textContent = nombre;
  $("pts-periodo").textContent = nombrePeriodo();
  const media = conPuntos ? Math.round((total / conPuntos) * 10) / 10 : 0;
  const res = $("pts-resumen"); res.textContent = "";
  [[jugados, "Partidos"], [fmtPts(total), "Puntos"], [conPuntos ? fmtPts(media) : "–", "Media"], [goles, "Goles"], [asist, "Asist."]].forEach(([v, t]) => {
    const e = document.createElement("div"); e.append(el("b", null, v), el("span", null, t)); res.append(e);
  });

  if (datos.length) seleccionar(datos[datos.length - 1], cols[cols.length - 1]);
  else { detalle.textContent = ""; detalle.append(el("span", "f", "No hay partidos de este jugador en este periodo.")); }

  $("modal-pts").classList.add("active");
  const wrap = $("pts-chart-wrap"); wrap.scrollLeft = wrap.scrollWidth;     // empieza viendo el último partido
}

      col.append(el("h4", null, titulo + (rMar != null ? ` · ${t === 1 ? rMar : bMar}` : "")));
      (partido.participantes || []).filter(x => x.team === t)
        .sort((a, b) => (b.puntosMVP || 0) - (a.puntosMVP || 0) || (b.goals || 0) - (a.goals || 0))
        .forEach(x => {
          const row = el("div", "pl clicable" + (x === mvp ? " mvp" : "") + (x.abandono ? " out" : ""));
          row.title = "Ver puntos por partido de " + x.name;
          row.addEventListener("click", () => abrirPuntosJugador(x.name));
          row.append(el("div", "pn", (x === mvp ? "⭐ " : "") + x.name + (x.abandono ? " (abandonó)" : "")));
          const mostrarPts = partido.modalidad !== "1v1" && typeof x.puntosMVP === "number" && !x.abandono;
          row.append(el("div", "pp", mostrarPts ? fmtPts(x.puntosMVP) + " pts" : ""));
          const ch = el("div", "ch");
          if (x.goals) ch.append(el("span", null, `⚽ ${x.goals}`));
          if (x.assists) ch.append(el("span", null, `🅰️ ${x.assists}`));
          if (x.ownGoals) ch.append(el("span", null, `🥅 ${x.ownGoals} pp`));
          if (x.saves) ch.append(el("span", null, `🧤 ${x.saves}`));
          if (x.cleanSheet) ch.append(el("span", null, "🔒 P. a 0"));
          if (x.recoveries) ch.append(el("span", null, `🛡️ ${x.recoveries}`));
          if (x.passesTotal) ch.append(el("span", null, `🎯 ${x.passesCompleted || 0}/${x.passesTotal} (${Math.round(((x.passesCompleted || 0) / x.passesTotal) * 100)}%)`));
          if (!ch.childNodes.length) ch.append(el("span", null, "Sin acciones registradas"));
          row.append(ch);
          col.append(row);
        });
      teams.append(col);
    });
    card.append(teams);
    grid.append(card);
  });

  $("sub").textContent = `Historial de partidos · ${lista.length} partido${lista.length === 1 ? "" : "s"}${matchMod !== "todas" ? " de " + matchMod.toUpperCase() : ""}.`;
}

function render() {
  document.title = "F7 Ranking Room - Temporada " + temporadaNum;
  pintarTiempo();
  pintarCuenta();
  pintarTabs();
  const esPartidos = tab === "partidos";
  $("sort-ctl").style.display = esPartidos ? "none" : "flex";
  $("wrap-ranking").hidden = esPartidos;
  $("podium").hidden = esPartidos;
  $("matches-view").hidden = !esPartidos;

  // selector de orden (se rellena una vez)
  const sel = $("sortKey");
  if (!sel.options.length) {
    SORT_OPTS.forEach(o => { const op = document.createElement("option"); op.value = o.k; op.textContent = o.t; sel.append(op); });
  }
  sel.value = SORT_OPTS.some(o => o.k === sortKey) ? sortKey : "";
  $("sortDir").textContent = sortDir === -1 ? "↓ Mayor a menor" : "↑ Menor a mayor";

  const datosJugadores = procesarDatosFiltrados();

  if (esPartidos) {
    pintarKpis(datosJugadores.length);
    pintarMatches();
    return;
  }

  const filtroTexto = $("q").value.toLowerCase();
  const head = $("head");
  const tb = $("rows");
  head.textContent = "";
  tb.textContent = "";

  let list = datosJugadores
    .map(p => obtenerVistaJugador(p, tab))
    .filter(Boolean)
    .map(derivar)
    .filter(p => p.matches >= minPJ)
    .filter(p => p.name.toLowerCase().includes(filtroTexto))
    .sort((a, b) =>
      sortDir * (valorOrden(a, sortKey) - valorOrden(b, sortKey)) ||
      (b.elo - a.elo) || a.name.localeCompare(b.name));

  pintarKpis(datosJugadores.length);
  pintarPodio(list);

  // cabecera: clic en una columna para ordenar
  const hr = document.createElement("tr");
  const thPos = el("th", null, "#"); hr.append(thPos);
  hr.append(el("th", null, "Jugador"));
  COLS.forEach(c => {
    const th = el("th", c.k === sortKey ? "sorted" : "", c.t + (c.k === sortKey ? (sortDir === -1 ? " ▼" : " ▲") : ""));
    th.dataset.k = c.k;
    th.addEventListener("click", () => {
      if (sortKey === c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = -1; }
      render();
    });
    hr.append(th);
  });
  head.append(hr);

  if (list.length === 0) {
    $("empty").hidden = false;
  } else {
    $("empty").hidden = true;
    const medallas = ["🥇", "🥈", "🥉"];
    list.forEach((p, i) => {
      const tr = document.createElement("tr");
      if (i === 0) tr.className = "top";

      const pos = document.createElement("td"); pos.className = "pos"; pos.textContent = medallas[i] || (i + 1); tr.append(pos);

      const nm = document.createElement("td"); nm.className = "name";
      nm.append(el("span", "avs", p.avatar), el("span", "nm", p.name));
      nm.addEventListener("click", () => abrirCarta(p));
      tr.append(nm);

      COLS.forEach(c => {
        const td = document.createElement("td");
        if (c.k === sortKey) td.className = "sorted";
        td.textContent = fmtValor(p, c.k);
        if (c.k === "winPct") {
          const b = el("span", "bar-wr"); const f = document.createElement("i"); f.style.width = p.winPct + "%"; b.append(f); td.append(b);
        }
        tr.append(td);
      });
      tb.append(tr);
    });
  }

  $("sub").textContent = cargando ? "Cargando…" : `Periodo [${nombrePeriodo().toUpperCase()}] · Modo [${tab.toUpperCase()}] · ${list.length} jugadores · ordenado por ${etiquetaOrden(sortKey).toLowerCase()}`;
}

function normalizarDb(json) {
  if (Array.isArray(json)) {
    const db = { jugadores: {}, partidaHistorial: [] };
    json.forEach(j => { if (j && j.name) db.jugadores[j.auth || j.name] = j; });
    return db;
  }
  if (json && typeof json === "object") {
    return { jugadores: json.jugadores || json, partidaHistorial: json.partidaHistorial || [] };
  }
  return { jugadores: {}, partidaHistorial: [] };
}

// Carga temporada-1.json, temporada-2.json... de las temporadas ya cerradas (una sola vez cada una)
async function cargarArchivos() {
  for (let n = 1; n < temporadaNum; n++) {
    if (dbArchivo[n] || archivoIntentado[n]) continue;
    archivoIntentado[n] = true;
    try {
      const r = await fetch(`temporada-${n}.json?t=` + Date.now());
      if (r.ok) dbArchivo[n] = normalizarDb(await r.json());
    } catch (e) {
      console.warn(`No se pudo cargar temporada-${n}.json:`, e);
    }
  }
}

async function load() {
  try {
    const r = await fetch("stats.json?t=" + Date.now());
    if (r.ok) {
      const json = await r.json();
      dbGlobal = normalizarDb(json);
      if (json && typeof json === "object" && !Array.isArray(json)) {
        if (+json.temporada > 0) temporadaNum = +json.temporada;
        if (json.temporadaFin) {
          const f = new Date(json.temporadaFin).getTime();
          if (!isNaN(f)) temporadaFin = f;
        }
      }
    }
  } catch (e) {
    console.error("Error al cargar stats.json:", e);
  }
  cargando = false;
  await cargarArchivos();
  render();
}

load();
setInterval(load, 15000);
setInterval(pintarCuenta, 1000);
</script>
</body>
</html>
